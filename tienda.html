<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mi Tienda - Inventario y Conversión</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    /* Pequeña corrección para line-clamp en navegadores sin plugin */
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    /* Toast position */
    #toastContainer { position: fixed; right: 1rem; bottom: 1rem; z-index: 60; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">
  <div class="container mx-auto px-4 py-8 max-w-6xl">
    <header class="text-center mb-6">
      <h1 class="text-3xl font-bold text-blue-600 mb-2"><i class="fas fa-store mr-2"></i>Gestor de Mi Tienda</h1>
      <p class="text-gray-500">Control de inventario, precios en dólares/bolívares y difusión por WhatsApp</p>
      <div class="mt-4 flex justify-center gap-3">
        <button id="exportBtn" class="bg-indigo-500 hover:bg-indigo-600 text-white px-3 py-1 rounded-md text-sm"><i class="fas fa-file-export mr-2"></i>Exportar JSON</button>
        <label for="importFile" class="bg-yellow-50 hover:bg-yellow-100 text-yellow-700 border border-yellow-200 px-3 py-1 rounded-md text-sm cursor-pointer">
          <i class="fas fa-file-import mr-2"></i>Importar JSON
        </label>
        <input id="importFile" accept="application/json" type="file" class="hidden">
      </div>
    </header>

    <!-- FORMULARIO -->
    <section class="bg-white rounded-xl shadow-md p-6 mb-8">
      <h2 class="text-xl font-semibold mb-4 text-gray-700"><i class="fas fa-plus-circle mr-2"></i><span id="formTitle">Agregar Nuevo Producto</span></h2>
      <form id="productForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" novalidate>
        <div>
          <label for="name" class="block text-sm font-medium text-gray-600 mb-1">Nombre del Producto</label>
          <input type="text" id="name" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label for="stock" class="block text-sm font-medium text-gray-600 mb-1">Cantidad en Inventario</label>
          <input type="number" id="stock" min="0" value="0" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label for="priceUSD" class="block text-sm font-medium text-gray-600 mb-1">Precio en Dólares ($)</label>
          <input type="number" step="0.01" id="priceUSD" min="0" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label for="exchangeRate" class="block text-sm font-medium text-gray-600 mb-1">Tasa del Dólar (Bs.)</label>
          <input type="number" step="0.01" id="exchangeRate" min="0" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <!-- Imagen -->
        <div class="md:col-span-2 lg:col-span-2">
          <label class="block text-sm font-medium text-gray-600 mb-1">Imagen del Producto (Galería o Cámara)</label>
          <div class="flex items-center gap-3">
            <label for="imageFile" class="cursor-pointer bg-blue-50 hover:bg-blue-100 text-blue-600 border border-blue-200 px-4 py-2 rounded-lg font-medium text-sm transition flex items-center gap-2">
              <i class="fas fa-camera"></i> Seleccionar o Tomar Foto
            </label>
            <input type="file" id="imageFile" accept="image/*" capture="environment" class="hidden">
            <span id="fileName" class="text-sm text-gray-400 truncate">Ninguna imagen seleccionada</span>
          </div>
        </div>

        <!-- Vista previa -->
        <div class="flex items-center justify-center">
          <div id="imagePreviewContainer" class="w-28 h-28 border rounded-lg overflow-hidden bg-gray-100 flex items-center justify-center text-gray-400 text-xs">
            Vista previa
          </div>
        </div>

        <div class="md:col-span-2 lg:col-span-3">
          <label for="description" class="block text-sm font-medium text-gray-600 mb-1">Descripción del Producto</label>
          <textarea id="description" rows="2" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>

        <div class="md:col-span-2 lg:col-span-3 text-right">
          <button type="submit" id="saveBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2 rounded-lg transition"><i class="fas fa-save mr-2"></i>Guardar Producto</button>
        </div>
      </form>
    </section>

    <!-- BUSCADOR -->
    <section class="mb-6">
      <div class="relative">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"><i class="fas fa-search"></i></span>
        <input type="text" id="searchInput" placeholder="Buscar producto por nombre..." class="w-full pl-10 pr-4 py-3 border rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
    </section>

    <!-- LISTADO -->
    <section>
      <h2 class="text-xl font-semibold mb-4 text-gray-700"><i class="fas fa-boxes mr-2"></i>Inventario de Productos</h2>
      <div id="productList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      <p id="noProducts" class="text-center text-gray-400 py-8 hidden">No hay productos registrados o coincidentes.</p>
    </section>
  </div>

  <!-- Toasts -->
  <div id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  <script>
    // Estado
    let products = JSON.parse(localStorage.getItem('products')) || [];
    let base64Image = ''; // imagen actual del formulario
    let editingId = null;

    // Elementos
    const productForm = document.getElementById('productForm');
    const productList = document.getElementById('productList');
    const searchInput = document.getElementById('searchInput');
    const noProducts = document.getElementById('noProducts');
    const imageFile = document.getElementById('imageFile');
    const fileName = document.getElementById('fileName');
    const imagePreviewContainer = document.getElementById('imagePreviewContainer');
    const exchangeRateInput = document.getElementById('exchangeRate');
    const exportBtn = document.getElementById('exportBtn');
    const importFile = document.getElementById('importFile');
    const formTitle = document.getElementById('formTitle');
    const saveBtn = document.getElementById('saveBtn');

    // Utility: mostrar toast
    function showToast(msg, type = 'info') {
      const container = document.getElementById('toastContainer');
      const id = 't' + Date.now();
      const bg = type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-gray-800';
      const el = document.createElement('div');
      el.id = id;
      el.className = `${bg} text-white px-4 py-2 rounded-md mb-2 shadow-md max-w-xs`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 400);
      }, 3500);
    }

    // Cargar tasa por defecto
    const DEFAULT_RATE_KEY = 'defaultExchangeRate';
    function loadDefaultRate() {
      const r = localStorage.getItem(DEFAULT_RATE_KEY);
      if (r) exchangeRateInput.value = parseFloat(r);
    }
    loadDefaultRate();

    // Guardar default rate cuando se cambia
    exchangeRateInput.addEventListener('change', () => {
      if (exchangeRateInput.value && !isNaN(parseFloat(exchangeRateInput.value))) {
        localStorage.setItem(DEFAULT_RATE_KEY, parseFloat(exchangeRateInput.value));
        showToast('Tasa guardada como valor por defecto', 'success');
      }
    });

    // Comprimir imagen con canvas y devolver base64
    function compressImageFile(file, maxWidth = 1000, quality = 0.8) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Error leyendo el archivo'));
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const ratio = img.width > maxWidth ? maxWidth / img.width : 1;
            const canvas = document.createElement('canvas');
            canvas.width = img.width * ratio;
            canvas.height = img.height * ratio;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const mime = 'image/jpeg';
            const dataUrl = canvas.toDataURL(mime, quality);
            resolve(dataUrl);
          };
          img.onerror = () => reject(new Error('Error cargando la imagen'));
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // Manejar selección de imagen (compress + preview)
    imageFile.addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;
      fileName.textContent = file.name;
      try {
        const compressed = await compressImageFile(file, 1000, 0.8);
        base64Image = compressed;
        imagePreviewContainer.innerHTML = `<img src="${base64Image}" alt="Preview" class="w-full h-full object-cover">`;
      } catch (err) {
        console.error(err);
        showToast('No se pudo procesar la imagen', 'error');
      }
    });

    // Guardar o actualizar producto
    productForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const stock = parseInt(document.getElementById('stock').value || 0, 10);
      const priceUSD = parseFloat(document.getElementById('priceUSD').value || 0);
      const exchangeRate = parseFloat(exchangeRateInput.value || 0);
      const description = document.getElementById('description').value.trim();

      if (!name) { showToast('El nombre es obligatorio', 'error'); return; }
      if (isNaN(priceUSD) || priceUSD < 0) { showToast('Precio inválido', 'error'); return; }
      if (isNaN(exchangeRate) || exchangeRate <= 0) { showToast('Tasa inválida', 'error'); return; }
      if (!base64Image && !editingId) { showToast('Por favor selecciona o toma una foto para el producto', 'error'); return; }

      // Guardar tasa por defecto
      localStorage.setItem(DEFAULT_RATE_KEY, exchangeRate);

      if (editingId) {
        // Update existing
        const idx = products.findIndex(p => p.id === editingId);
        if (idx === -1) { showToast('Producto no encontrado', 'error'); return; }
        products[idx] = {
          ...products[idx],
          name, stock, priceUSD, exchangeRate, description,
          image: base64Image || products[idx].image
        };
        showToast('Producto actualizado', 'success');
      } else {
        // New
        const newProduct = {
          id: Date.now(),
          name, stock, priceUSD, exchangeRate, description,
          image: base64Image
        };
        products.push(newProduct);
        showToast('Producto guardado', 'success');
      }

      syncStorage();
      resetForm();
    });

    function resetForm() {
      productForm.reset();
      base64Image = '';
      editingId = null;
      fileName.textContent = 'Ninguna imagen seleccionada';
      imagePreviewContainer.innerHTML = 'Vista previa';
      formTitle.textContent = 'Agregar Nuevo Producto';
      saveBtn.innerHTML = '<i class="fas fa-save mr-2"></i>Guardar Producto';
      // Restablecer la tasa al valor por defecto guardado
      loadDefaultRate();
    }

    // Sincronizar con LocalStorage y renderizar
    function syncStorage() {
      localStorage.setItem('products', JSON.stringify(products));
      renderProducts(products);
    }

    // Renderizar
    function renderProducts(arrayToRender) {
      productList.innerHTML = '';
      if (arrayToRender.length === 0) {
        noProducts.classList.remove('hidden');
        return;
      } else {
        noProducts.classList.add('hidden');
      }

      arrayToRender.forEach(prod => {
        const totalVES = (prod.priceUSD * prod.exchangeRate).toFixed(2);

        const card = document.createElement('div');
        card.className = 'bg-white rounded-xl shadow-md overflow-hidden flex flex-col justify-between border border-gray-100 hover:shadow-lg transition';

        // Crear innerHTML seguro (escapar mínimamente)
        const safeName = escapeHtml(prod.name);
        const safeDesc = escapeHtml(prod.description);

        card.innerHTML = `
          <div>
            <div class="h-48 overflow-hidden bg-gray-200 relative">
              <img src="${prod.image}" alt="${safeName}" loading="lazy" class="w-full h-full object-cover">
              <span class="absolute top-2 right-2 bg-black/60 text-white text-xs px-2 py-1 rounded-full">Stock: ${prod.stock}</span>
            </div>
            <div class="p-4">
              <h3 class="font-bold text-lg text-gray-800 mb-1">${safeName}</h3>
              <p class="text-sm text-gray-600 mb-3 line-clamp-2">${safeDesc}</p>
              <div class="bg-blue-50 p-3 rounded-lg mb-4">
                <p class="text-blue-700 font-bold text-lg">$${prod.priceUSD.toFixed(2)} USD</p>
                <p class="text-gray-600 text-sm">Bs. ${totalVES} <span class="text-xs text-gray-400">(Tasa: ${prod.exchangeRate})</span></p>
              </div>
            </div>
          </div>
          <div class="p-4 pt-0 flex gap-2">
            <button data-id="${prod.id}" class="shareBtn flex-1 bg-green-500 hover:bg-green-600 text-white text-sm font-medium py-2 px-3 rounded-lg transition flex items-center justify-center gap-1">
              <i class="fab fa-whatsapp"></i> Compartir
            </button>
            <button data-id="${prod.id}" class="editBtn bg-blue-50 hover:bg-blue-100 text-blue-700 text-sm py-2 px-3 rounded-lg transition">
              <i class="fas fa-edit"></i>
            </button>
            <div class="flex items-center gap-1">
              <button data-id="${prod.id}" class="decStock bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm py-2 px-2 rounded-lg transition" title="Quitar 1"><i class="fas fa-minus"></i></button>
              <button data-id="${prod.id}" class="incStock bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm py-2 px-2 rounded-lg transition" title="Agregar 1"><i class="fas fa-plus"></i></button>
              <button data-id="${prod.id}" class="deleteBtn bg-red-100 hover:bg-red-200 text-red-600 text-sm py-2 px-3 rounded-lg transition" title="Eliminar"><i class="fas fa-trash"></i></button>
            </div>
          </div>
        `;

        productList.appendChild(card);
      });

      // Delegación de eventos para botones creados
      document.querySelectorAll('.shareBtn').forEach(b => b.addEventListener('click', (e) => {
        const id = Number(e.currentTarget.getAttribute('data-id'));
        shareWhatsApp(id);
      }));
      document.querySelectorAll('.deleteBtn').forEach(b => b.addEventListener('click', (e) => {
        const id = Number(e.currentTarget.getAttribute('data-id'));
        deleteProduct(id);
      }));
      document.querySelectorAll('.editBtn').forEach(b => b.addEventListener('click', (e) => {
        const id = Number(e.currentTarget.getAttribute('data-id'));
        editProduct(id);
      }));
      document.querySelectorAll('.incStock').forEach(b => b.addEventListener('click', (e) => {
        const id = Number(e.currentTarget.getAttribute('data-id'));
        adjustStock(id, 1);
      }));
      document.querySelectorAll('.decStock').forEach(b => b.addEventListener('click', (e) => {
        const id = Number(e.currentTarget.getAttribute('data-id'));
        adjustStock(id, -1);
      }));
    }

    // Escapar texto mínimo para evitar inyección en el innerHTML de templates
    function escapeHtml(text) {
      if (!text && text !== 0) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Buscar en tiempo real
    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      const filtered = products.filter(p => p.name.toLowerCase().includes(term));
      renderProducts(filtered);
    });

    // Eliminar producto
    function deleteProduct(id) {
      if (!confirm('¿Estás seguro de eliminar este producto?')) return;
      products = products.filter(p => p.id !== id);
      syncStorage();
      showToast('Producto eliminado', 'success');
    }

    // Editar producto
    function editProduct(id) {
      const prod = products.find(p => p.id === id);
      if (!prod) { showToast('Producto no encontrado', 'error'); return; }
      document.getElementById('name').value = prod.name;
      document.getElementById('stock').value = prod.stock;
      document.getElementById('priceUSD').value = prod.priceUSD;
      document.getElementById('exchangeRate').value = prod.exchangeRate;
      document.getElementById('description').value = prod.description;
      base64Image = prod.image || '';
      if (base64Image) imagePreviewContainer.innerHTML = `<img src="${base64Image}" alt="Preview" class="w-full h-full object-cover">`;
      fileName.textContent = 'Imagen cargada';
      editingId = id;
      formTitle.textContent = 'Editar Producto';
      saveBtn.innerHTML = '<i class="fas fa-save mr-2"></i>Actualizar Producto';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Ajustar stock
    function adjustStock(id, delta) {
      const idx = products.findIndex(p => p.id === id);
      if (idx === -1) return;
      products[idx].stock = Math.max(0, (products[idx].stock || 0) + delta);
      syncStorage();
    }

    // Compartir por WhatsApp o Web Share con imagen si es posible
    async function shareWhatsApp(id) {
      const prod = products.find(p => p.id === id);
      if (!prod) return;
      const totalVES = (prod.priceUSD * prod.exchangeRate).toFixed(2);

      const message = `¡Hola! Me interesa este producto:%0A%0A` +
                      `📦 *${prod.name}*%0A` +
                      `📝 ${prod.description}%0A` +
                      `💲 Precio: $${prod.priceUSD.toFixed(2)} USD (Bs. ${totalVES})%0A` +
                      `📊 Disponibles: ${prod.stock} unidades`;

      // Intentar Web Share API con archivo si está disponible
      if (navigator.canShare && prod.image) {
        try {
          // Convertir base64 a blob
          const res = await fetch(prod.image);
          const blob = await res.blob();
          const file = new File([blob], `${prod.name.replace(/\s+/g, '_')}.jpg`, { type: blob.type || 'image/jpeg' });
          if (navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], text: decodeURIComponent(message), title: prod.name });
            return;
          }
        } catch (err) {
          console.warn('Web Share falló o no soporta archivos: ', err);
        }
      }

      // Fallback a enlace de WhatsApp con texto
      const whatsappUrl = `https://api.whatsapp.com/send?text=${message}`;
      window.open(whatsappUrl, '_blank');
    }

    // Exportar JSON
    exportBtn.addEventListener('click', () => {
      const dataStr = JSON.stringify(products, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `inventario_${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('Exportado inventario (JSON)', 'success');
    });

    // Importar JSON (merge)
    importFile.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const imported = JSON.parse(reader.result);
          if (!Array.isArray(imported)) throw new Error('Formato inválido');
          // Simple merge: keep existing ids, add new ones (if same id, overwrite)
          const map = new Map(products.map(p => [p.id, p]));
          imported.forEach(item => {
            if (!item.id) item.id = Date.now() + Math.floor(Math.random()*1000);
            map.set(item.id, item);
          });
          products = Array.from(map.values());
          syncStorage();
          showToast('Importación completada', 'success');
        } catch (err) {
          console.error(err);
          showToast('Error al importar JSON', 'error');
        }
      };
      reader.onerror = () => showToast('No se pudo leer el archivo', 'error');
      reader.readAsText(file);
      // reset input
      e.target.value = '';
    });

    // Inicial render
    renderProducts(products);

    // Guardar en localStorage antes de cerrar (opcional)
    window.addEventListener('beforeunload', () => {
      localStorage.setItem('products', JSON.stringify(products));
    });
  </script>
</body>
</html>
