<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Tienda - Inventario y Conversión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        #toastContainer { position: fixed; right: 1rem; bottom: 1rem; z-index: 60; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <header class="text-center mb-6">
            <h1 class="text-3xl font-bold text-blue-600 mb-2"><i class="fas fa-store mr-2"></i>Gestor de Mi Tienda</h1>
            <p class="text-gray-500">Control de inventario, precios en bolívares y difusión por WhatsApp</p>
            <div class="mt-4 flex justify-center gap-3">
                <button id="exportBtn" class="bg-indigo-500 hover:bg-indigo-600 text-white px-3 py-1 rounded-md text-sm"><i class="fas fa-file-export mr-2"></i>Exportar JSON</button>
                <label for="importFile" class="bg-yellow-50 hover:bg-yellow-100 text-yellow-700 border border-yellow-200 px-3 py-1 rounded-md text-sm cursor-pointer">
                    <i class="fas fa-file-import mr-2"></i>Importar JSON
                </label>
                <input id="importFile" accept="application/json" type="file" class="hidden">
            </div>
        </header>

        <!-- CONFIGURACIÓN GLOBAL (TASA Y PAGO MÓVIL) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <!-- Tasa de Cambio -->
            <section class="bg-white rounded-xl shadow-md p-4 flex items-center justify-between gap-4 border-l-4 border-blue-500">
                <div class="flex items-center gap-3">
                    <i class="fas fa-exchange-alt text-blue-500 text-xl"></i>
                    <div>
                        <label for="globalExchangeRate" class="block text-sm font-medium text-gray-700">Tasa del Dólar (Bs.)</label>
                        <span class="text-xs text-gray-400">Actualiza para recalcular precios</span>
                    </div>
                </div>
                <input type="number" id="globalExchangeRate" step="0.01" min="0" value="36.50" class="w-32 border-2 border-blue-200 rounded-lg px-3 py-2 font-bold text-blue-600 text-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-center">
            </section>

            <!-- Datos de Pago Móvil Editables -->
            <section class="bg-white rounded-xl shadow-md p-4 border-l-4 border-green-500">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-sm font-semibold text-gray-700"><i class="fas fa-mobile-alt text-green-500 mr-1"></i> Datos de Pago Móvil</span>
                    <button type="button" id="togglePmBtn" class="text-xs text-blue-600 hover:underline"><i class="fas fa-cog"></i> Editar Datos</button>
                </div>
                <div id="pagoMovilDisplay" class="text-xs text-gray-600">
                    <!-- Se llena dinámicamente -->
                </div>
                <div id="pagoMovilEditForm" class="hidden mt-2 space-y-2">
                    <input type="text" id="pmBanco" placeholder="Banco (Ej: Banco de Venezuela)" class="w-full text-xs border rounded px-2 py-1.5 focus:ring-2 focus:ring-green-500 focus:outline-none">
                    <input type="text" id="pmTelefono" placeholder="Teléfono (Ej: 0412-1234567)" class="w-full text-xs border rounded px-2 py-1.5 focus:ring-2 focus:ring-green-500 focus:outline-none">
                    <input type="text" id="pmCedula" placeholder="Cédula o RIF (Ej: V-12345678)" class="w-full text-xs border rounded px-2 py-1.5 focus:ring-2 focus:ring-green-500 focus:outline-none">
                    <button type="button" id="savePmBtn" class="bg-green-600 text-white text-xs px-3 py-1.5 rounded hover:bg-green-700 w-full font-semibold">Guardar Datos de Pago</button>
                </div>
            </section>
        </div>

        <!-- FORMULARIO DE PRODUCTOS -->
        <section class="bg-white rounded-xl shadow-md p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4 text-gray-700"><i class="fas fa-plus-circle mr-2"></i><span id="formTitle">Agregar Nuevo Producto</span></h2>
            <form id="productForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <input type="hidden" id="editIndex" value="-1">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-600 mb-1">Nombre del Producto</label>
                    <input type="text" id="name" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label for="stock" class="block text-sm font-medium text-gray-600 mb-1">Cantidad en Inventario</label>
                    <input type="number" id="stock" min="0" value="0" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label for="priceUSD" class="block text-sm font-medium text-gray-600 mb-1">Precio en Dólares ($)</label>
                    <input type="number" id="priceUSD" step="0.01" min="0" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="md:col-span-2 lg:col-span-2">
                    <label class="block text-sm font-medium text-gray-600 mb-1">Imagen del Producto (Galería o Cámara)</label>
                    <div class="flex items-center gap-3">
                        <label for="imageFile" class="cursor-pointer bg-blue-50 hover:bg-blue-100 text-blue-600 border border-blue-200 px-4 py-2 rounded-lg flex items-center gap-2">
                            <i class="fas fa-camera"></i> Seleccionar o Tomar Foto
                        </label>
                        <input type="file" id="imageFile" accept="image/*" class="hidden">
                        <span id="fileName" class="text-sm text-gray-400 truncate">Ninguna imagen seleccionada</span>
                    </div>
                </div>
                <div class="flex items-center justify-center">
                    <div id="imagePreviewContainer" class="w-28 h-28 border rounded-lg overflow-hidden bg-gray-100 flex items-center justify-center">
                        <span class="text-xs text-gray-400">Sin vista previa</span>
                    </div>
                </div>
                <div class="md:col-span-2 lg:col-span-3">
                    <label for="description" class="block text-sm font-medium text-gray-600 mb-1">Descripción</label>
                    <textarea id="description" rows="2" required class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <div class="md:col-span-2 lg:col-span-3 text-right">
                    <button type="submit" id="saveBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition font-semibold">Guardar Producto</button>
                </div>
            </form>
        </section>

        <!-- LISTADO DE PRODUCTOS -->
        <section>
            <h2 class="text-xl font-semibold mb-4 text-gray-700"><i class="fas fa-boxes mr-2"></i>Inventario Actual</h2>
            <div id="productList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Se generan dinámicamente -->
            </div>
        </section>
    </div>

    <div id="toastContainer"></div>

    <script>
        let products = JSON.parse(localStorage.getItem('products')) || [];
        let globalExchangeRate = parseFloat(localStorage.getItem('globalExchangeRate')) || 36.50;
        let pagoMovilData = JSON.parse(localStorage.getItem('pagoMovilData')) || { banco: 'Banco de Venezuela', telefono: '0412-0000000', cedula: 'V-00000000' };
        let currentImageBase64 = '';

        const globalExchangeRateInput = document.getElementById('globalExchangeRate');
        globalExchangeRateInput.value = globalExchangeRate;

        updatePagoMovilUI();

        // Controladores para Pago Móvil (Evita conflictos con formularios principales)
        document.getElementById('togglePmBtn').addEventListener('click', () => {
            const form = document.getElementById('pagoMovilEditForm');
            form.classList.toggle('hidden');
            if (!form.classList.contains('hidden')) {
                document.getElementById('pmBanco').value = pagoMovilData.banco;
                document.getElementById('pmTelefono').value = pagoMovilData.telefono;
                document.getElementById('pmCedula').value = pagoMovilData.cedula;
            }
        });

        document.getElementById('savePmBtn').addEventListener('click', () => {
            pagoMovilData = {
                banco: document.getElementById('pmBanco').value.trim() || 'N/A',
                telefono: document.getElementById('pmTelefono').value.trim() || 'N/A',
                cedula: document.getElementById('pmCedula').value.trim() || 'N/A'
            };
            localStorage.setItem('pagoMovilData', JSON.stringify(pagoMovilData));
            updatePagoMovilUI();
            document.getElementById('pagoMovilEditForm').classList.add('hidden');
            showToast('Datos de Pago Móvil actualizados');
        });

        function updatePagoMovilUI() {
            const display = document.getElementById('pagoMovilDisplay');
            display.innerHTML = `🏦 <b>${pagoMovilData.banco}</b><br>📱 ${pagoMovilData.telefono}<br>🆔 ${pagoMovilData.cedula}`;
        }

        const productForm = document.getElementById('productForm');
        const imageFile = document.getElementById('imageFile');
        const fileName = document.getElementById('fileName');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const productList = document.getElementById('productList');
        const exportBtn = document.getElementById('exportBtn');
        const importFile = document.getElementById('importFile');

        globalExchangeRateInput.addEventListener('input', (e) => {
            globalExchangeRate = parseFloat(e.target.value) || 0;
            localStorage.setItem('globalExchangeRate', globalExchangeRate);
            renderProducts();
        });

        // Manejo mejorado de imágenes para celulares
        imageFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                fileName.textContent = file.name;
                const reader = new FileReader();
                reader.onload = (uploadEvent) => {
                    currentImageBase64 = uploadEvent.target.result;
                    imagePreviewContainer.innerHTML = `<img src="${currentImageBase64}" class="w-full h-full object-cover">`;
                };
                reader.readAsDataURL(file);
            }
        });

        productForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const index = parseInt(document.getElementById('editIndex').value);
            
            // Verificamos si hay una imagen nueva o mantenemos la existente al editar
            let finalImage = currentImageBase64;
            if (!finalImage && index > -1 && products[index]) {
                finalImage = products[index].image;
            }

            const product = {
                name: document.getElementById('name').value.trim(),
                stock: parseInt(document.getElementById('stock').value) || 0,
                priceUSD: parseFloat(document.getElementById('priceUSD').value) || 0,
                description: document.getElementById('description').value.trim(),
                image: finalImage || ''
            };

            if (index > -1) {
                products[index] = product;
                document.getElementById('editIndex').value = '-1';
                document.getElementById('formTitle').textContent = 'Agregar Nuevo Producto';
                document.getElementById('saveBtn').textContent = 'Guardar Producto';
            } else {
                products.push(product);
            }

            localStorage.setItem('products', JSON.stringify(products));
            productForm.reset();
            currentImageBase64 = '';
            fileName.textContent = 'Ninguna imagen seleccionada';
            imagePreviewContainer.innerHTML = '<span class="text-xs text-gray-400">Sin vista previa</span>';
            renderProducts();
            showToast('¡Producto guardado con éxito!');
        });

        function renderProducts() {
            if (products.length === 0) {
                productList.innerHTML = '<p class="text-gray-400 col-span-full text-center py-8">No hay productos registrados aún.</p>';
                return;
            }
            productList.innerHTML = '';
            products.forEach((p, index) => {
                const totalBs = (p.priceUSD * globalExchangeRate).toFixed(2);
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-md overflow-hidden flex flex-col justify-between';
                card.innerHTML = `
                    <div>
                        ${p.image ? `<img src="${p.image}" class="w-full h-48 object-cover">` : `<div class="w-full h-48 bg-gray-100 flex items-center justify-center text-gray-400"><i class="fas fa-image fa-2x"></i></div>`}
                        <div class="p-4">
                            <h3 class="font-bold text-lg mb-1">${p.name}</h3>
                            <p class="text-gray-600 text-sm line-clamp-2 mb-2">📝 ${p.description}</p>
                            <div class="flex items-center justify-between bg-gray-50 p-2 rounded-lg mb-3 border">
                                <span class="text-sm text-gray-600">Stock: <b>${p.stock}</b></span>
                                <div class="flex items-center gap-1">
                                    <button type="button" onclick="updateStock(${index}, -1)" class="bg-red-100 hover:bg-red-200 text-red-600 w-7 h-7 rounded-md font-bold flex items-center justify-center" title="Vender / Restar 1">-</button>
                                    <button type="button" onclick="updateStock(${index}, 1)" class="bg-green-100 hover:bg-green-200 text-green-600 w-7 h-7 rounded-md font-bold flex items-center justify-center" title="Sumar 1 stock">+</button>
                                </div>
                            </div>
                            <p class="text-green-600 font-bold text-lg mb-1">💰 Precio: Bs. ${totalBs}</p>
                            
                            <!-- Opción para incluir Pago Móvil al compartir -->
                            <div class="mt-3 pt-2 border-t flex items-center gap-2">
                                <input type="checkbox" id="includePM_${index}" checked class="rounded text-blue-600 focus:ring-blue-500 w-4 h-4">
                                <label for="includePM_${index}" class="text-xs text-gray-600 cursor-pointer">Incluir datos de Pago Móvil al compartir</label>
                            </div>
                        </div>
                    </div>
                    <div class="p-4 bg-gray-50 border-t flex justify-between items-center gap-2">
                        <button type="button" onclick="shareWhatsApp(${index})" class="bg-green-500 hover:bg-green-600 text-white px-3 py-2 rounded-lg text-sm flex items-center gap-2 w-full justify-center font-semibold"><i class="fab fa-whatsapp"></i> Compartir WhatsApp</button>
                        <div class="flex gap-2">
                            <button type="button" onclick="editProduct(${index})" class="text-blue-500 hover:text-blue-700 px-2" title="Editar"><i class="fas fa-edit"></i></button>
                            <button type="button" onclick="deleteProduct(${index})" class="text-red-500 hover:text-red-700 px-2" title="Eliminar"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
                productList.appendChild(card);
            });
        }

        function updateStock(index, amount) {
            products[index].stock += amount;
            if (products[index].stock < 0) products[index].stock = 0;
            localStorage.setItem('products', JSON.stringify(products));
            renderProducts();
        }

        function shareWhatsApp(index) {
            const p = products[index];
            const totalBs = (p.priceUSD * globalExchangeRate).toFixed(2);
            const includePMCheckbox = document.getElementById(`includePM_${index}`);
            const includePM = includePMCheckbox ? includePMCheckbox.checked : true;
            const fechaActual = new Date().toLocaleDateString('es-VE');

            let text = `🛒 *${p.name}*%0A%0A`;
            text += `💰 *Precio: Bs. ${totalBs}*%0A`;
            text += `📦 *Descripción:* ${p.description}%0A`;
            text += `📦 *Stock:* ${p.stock} disponible(s)%0A`;

            if (includePM) {
                text += `%0A📱 *Pago Móvil:*%0A`;
                text += `🏦 Banco: ${pagoMovilData.banco}%0A`;
                text += `📞 Teléfono: ${pagoMovilData.telefono}%0A`;
                text += `🆔 Cédula/RIF: ${pagoMovilData.cedula}%0A`;
            }

            text += `%0A📅 *Fecha:* ${fechaActual}%0A%0A`;
            text += `📲 ¡Contáctanos para más información!`;

            window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
        }

        function editProduct(index) {
            const p = products[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('name').value = p.name;
            document.getElementById('stock').value = p.stock;
            document.getElementById('priceUSD').value = p.priceUSD;
            document.getElementById('description').value = p.description;
            document.getElementById('formTitle').textContent = 'Editar Producto';
            document.getElementById('saveBtn').textContent = 'Actualizar Producto';
            
            currentImageBase64 = ''; // Limpiamos temporal para que conserve la imagen si no se cambia
            if (p.image) {
                imagePreviewContainer.innerHTML = `<img src="${p.image}" class="w-full h-full object-cover">`;
                fileName.textContent = 'Imagen actual cargada';
            } else {
                imagePreviewContainer.innerHTML = '<span class="text-xs text-gray-400">Sin vista previa</span>';
                fileName.textContent = 'Ninguna imagen seleccionada';
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteProduct(index) {
            if (confirm('¿Estás seguro de eliminar este producto?')) {
                products.splice(index, 1);
                localStorage.setItem('products', JSON.stringify(products));
                renderProducts();
                showToast('Producto eliminado');
            }
        }

        exportBtn.addEventListener('click', () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(products));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "inventario_tienda.json");
            dlAnchorElem.click();
        });

        importFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        products = JSON.parse(event.target.result);
                        localStorage.setItem('products', JSON.stringify(products));
                        renderProducts();
                        showToast('Inventario importado con éxito');
                    } catch (err) {
                        alert('Archivo JSON inválido');
                    }
                };
                reader.readAsText(file);
            }
        });

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'bg-gray-800 text-white px-4 py-2 rounded-lg shadow-lg mt-2 text-sm';
            toast.textContent = message;
            document.getElementById('toastContainer').appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        renderProducts();
    </script>
</body>
</html>
